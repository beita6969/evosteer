resident_trajectories: 16
actor_requests: 8
environment_calls: 8
terminal_evaluations: 8
process_graders: 4
transport_threads: 16
coordinator_participates: true
max_running_requests: 12
max_loras_per_batch: 2
pipeline_mode: within-step
# Pair with the qualified FP32/page-64 training cache service.
rollout_scheduling_policy: long-horizon-first-stable@1
# Completed ALFWorld steps compute only temporary ∇Delta; no partial updates.
provisional_edge_gradients: true
z_feature_cache_entries: 256
# The measured 512 MiB limit held only eight out-of-order Qwen contributions.
# This host-memory cap fits the complete fixed batch without changing reduction.
gradient_buffer_bytes: 2147483648
disable_radix_cache: false
deterministic_gradients: true

# Separate execution condition; no task/TTB/posterior changes.
request_scheduling_policy: horizon-action-aging@1
provisional_queue_bytes: 134217728
provisional_plan_bytes: 1073741824
provisional_device_bytes: 536870912
