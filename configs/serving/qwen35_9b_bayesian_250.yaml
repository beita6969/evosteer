# Formal B28: input allowance 65536 plus largest action completion 2048.
# Retain the qualified FP32/page-64 hybrid cache and deterministic sampler.
format: skillev-sglang-service@6
model_path_env: SKILLEV_MODEL_PATH
tokenizer_path_env: SKILLEV_TOKENIZER_PATH
served_model_name: qwen35-direct-base
supervisor_adapter_name: training-policy
host: 127.0.0.1
port: 18472
context_length: 67584
tensor_parallel_size: 1
enable_deterministic_inference: true
sampling_backend: pytorch
enable_multimodal: false
max_lora_rank: 4
max_loaded_loras: 3
lora_target_modules: [all]
enable_metrics: true
# Request-ID-correlated scheduler timing; missing response timings remain null.
enable_request_time_stats_logging: true
max_running_requests: 12
max_loras_per_batch: 2
mem_fraction_static: 0.75
chunked_prefill_size: 4096
max_prefill_tokens: 8192
attention_backend: fa3
linear_attn_backend: triton
grammar_backend: xgrammar
reasoning_parser: qwen3
# Capture only the serving range, not the upstream default of 256 requests.
cuda_graph_max_bs_decode: 12
disable_radix_cache: false
mamba_radix_cache_strategy: extra_buffer
page_size: 64
# Keep persistent GDN checkpoints in the native FP32 state precision.
fp32_mamba_checkpoints: true
disable_overlap_schedule: false
