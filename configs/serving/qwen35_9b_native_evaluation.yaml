# Separate from the training service: no training deployment defaults change.
# Requests still use the frozen base model without an adapter route.
format: skillev-sglang-service@6
model_path_env: SKILLEV_MODEL_PATH
tokenizer_path_env: SKILLEV_TOKENIZER_PATH
served_model_name: qwen35-direct-base
supervisor_adapter_name: unused-for-native-evaluation
host: 127.0.0.1
port: 18045
context_length: 98304
tensor_parallel_size: 1
enable_deterministic_inference: true
sampling_backend: pytorch
enable_multimodal: false
max_lora_rank: 4
max_loaded_loras: 3
lora_target_modules: [all]
enable_metrics: true
max_running_requests: 48
max_loras_per_batch: 2
mem_fraction_static: 0.82
chunked_prefill_size: 8192
max_prefill_tokens: 16384
attention_backend: fa3
linear_attn_backend: triton
grammar_backend: xgrammar
reasoning_parser: qwen3
# Capture only the serving range, not the upstream default of 256 requests.
cuda_graph_max_bs_decode: 48
disable_radix_cache: false
# Preserve FP32 recurrent checkpoints across prefix hits; BF16 checkpoints
# changed cached-request logprobs in the fixed synthetic cold/warm comparison.
mamba_radix_cache_strategy: extra_buffer
page_size: 64
fp32_mamba_checkpoints: true
disable_overlap_schedule: false
