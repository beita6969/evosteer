    selection_rule: frozen-private-manifest-order
    n: 128
    comparability: approximate-only
    evidence: *reconstructed_interactive_evidence
    prompt: scienceworld-native-react@2
    decoding: qwen35-nonthinking-general@1
    parser: native-action@2
    scorer: scienceworld-official-reward@1
    environment_contract: scienceworld-official-text@2
    invalid_candidate_policy: terminate-zero
    invalid_environment_action_policy: delegate-to-official-env
    history_window_steps: 16
    horizon_policy: official-case-max-steps
