formal_run:
  final_attempts: 1
  max_samples_per_benchmark: 128
  retries_after_candidate_failure: 0
  result_based_sampling: forbidden
  private_outputs_required: true

aggregates:
  - id: avg-iid-answer-em
    reference_percent: "52.91"
    reducer: arithmetic-mean
    components: [[hotpotqa, em], [triviaqa, em]]
  - id: avg-iid-answer-f1
    reference_percent: "65.00"
    reducer: arithmetic-mean
    components: [[hotpotqa, f1], [triviaqa, f1]]
  - id: avg-iid-acc-pass
    reference_percent: "45.11"
    reducer: arithmetic-mean
    components: [[aime-2026, accuracy], [medqa, accuracy], [webshop, average_score], [webshop, success_rate], [alfworld, success_rate], [swe-bench, resolved]]
  - id: avg-ood-em
    reference_percent: "30.47"
    reducer: arithmetic-mean
    components: [[musique, em], [nq-open, em]]
  - id: avg-ood-f1
    reference_percent: "47.22"
    reducer: arithmetic-mean
    components: [[musique, f1], [nq-open, f1], [mind2web, action_f1]]
  - id: avg-ood-acc-pass
    reference_percent: "55.69"
    reducer: arithmetic-mean
    components: [[math-hard, accuracy], [gpqa-diamond, accuracy], [humaneval, pass_at_1], [scienceworld, success_rate], [scienceworld, average_score], [mind2web, step_accuracy]]
