    selection_rule: frozen-private-manifest-order
    n: 128
    comparability: approximate-only
    evidence: *reconstructed_static_evidence
    prompt: mind2web-offline-action@2
    decoding: qwen35-nonthinking-general@1
    parser: native-action@2
    scorer: mind2web-official-step@2
    action_f1_contract: operation-value-string@1
    seed_aggregation: *unknown_seed
    metrics:
      - {id: step_accuracy, reference_percent: "26.64", source_scale: unit-interval}
