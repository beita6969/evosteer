  - id: humaneval
    role: ood
    population: official-v1-seed42-reconstruction
    dataset_revision: runtime-source-revision-in-private-manifest
    selection_rule: frozen-private-manifest-order
    n: 128
    comparability: approximate-only
    evidence: *reconstructed_static_evidence
    prompt: direct-code@1
    decoding: qwen35-humaneval-deterministic@1
    parser: python-source@2
    scorer: humaneval-official-pass1@1
    seed_aggregation: *unknown_seed
    metrics:
      - {id: pass_at_1, reference_percent: "89.06", source_scale: unit-interval}
  - id: scienceworld
